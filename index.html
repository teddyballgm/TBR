<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tefleming — Books</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --surface: #fefefc;
      --border: #dedad2;
      --text: #1a1a17;
      --muted: #6b6860;
      --accent: #7a3e1a;
      --accent-hover: #5c2e12;
      --accent-light: #f0e8df;
      --green: #2a5c3f;
      --amber: #7a5a1a;
      --tan: #8a7040;
      --red: #6b2a2a;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --r: 4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Inputs ────────────────────────────────────────────────────── */

    input[type="text"],
    select,
    textarea {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 12px;
      font-family: var(--sans);
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      margin-bottom: 8px;
    }
    input[type="text"] { -webkit-appearance: none; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }
    input::placeholder, textarea::placeholder { color: #bbb; }
    textarea { resize: vertical; min-height: 80px; }
    select { cursor: pointer; }

    /* ── Buttons ───────────────────────────────────────────────────── */

    .btn-primary {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 10px 20px;
      font-family: var(--sans);
      font-size: 14px;
      cursor: pointer;
      margin-top: 4px;
      min-height: 44px;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Utilities ─────────────────────────────────────────────────── */

    .error-msg { color: #c0392b; font-size: 13px; margin: 6px 0; min-height: 18px; }

    /* ── App layout ────────────────────────────────────────────────── */

    #app { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 28px 0 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: normal;
      letter-spacing: .01em;
    }

    /* ── Tabs ──────────────────────────────────────────────────────── */

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 12px 20px;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: -1px;
      letter-spacing: .02em;
      min-height: 44px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }

    /* ── Loading / error ───────────────────────────────────────────── */

    .loading { color: var(--muted); font-size: 14px; padding: 32px 0; }

    /* ── TBR tier sections ─────────────────────────────────────────── */

    .tier-section { margin-bottom: 52px; }

    .tier-heading {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .tier-chevron { font-size: 9px; flex-shrink: 0; }

    .tier-body {
      overflow: hidden;
      max-height: 20000px;
      transition: max-height 0.35s ease;
    }
    .tier-section.collapsed .tier-body,
    .already-read.collapsed .tier-body { max-height: 0; }

    /* ── TBR book entries ──────────────────────────────────────────── */

    .tbr-book {
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .tbr-book:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .book-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .book-byline {
      font-size: 13px;
      color: var(--muted);
    }
    .book-rec { font-style: italic; }

    .book-header {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .book-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .book-chevron {
      font-size: 10px;
      color: var(--muted);
      padding-top: 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .book-header-text { flex: 1; min-width: 0; }
    .book-body {
      overflow: hidden;
      max-height: 2000px;
      padding-top: 10px;
      transition: max-height 0.25s ease;
    }
    .tbr-book.collapsed .book-body { max-height: 0; }

    .kindle-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .kindle-line a {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--accent-light);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .kindle-line a:hover { background: #e8d8cc; }
    .owned-pill {
      font-size: 12px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent-light);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .price { color: var(--text); font-weight: 500; }
    .price-orig { text-decoration: line-through; color: var(--muted); }
    .price-alert { font-size: 12px; }
    .price-untracked { font-size: 12px; font-style: italic; }

    .book-field { margin-bottom: 12px; }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .field-body { font-size: 14px; line-height: 1.7; }

    /* ── Already Read ──────────────────────────────────────────────── */

    .already-read { margin-top: 52px; }
    .already-read .tier-heading { margin-bottom: 16px; }
    .already-read ul { list-style: none; }
    .already-read li {
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .already-read li:last-child { border-bottom: none; }

    /* ── Submission forms ──────────────────────────────────────────── */

    .submit-section {
      margin-top: 60px;
      border-top: 2px solid var(--border);
      padding-top: 36px;
    }
    .submit-section h2 {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: normal;
      margin-bottom: 6px;
    }
    .sub-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .field-row { margin-bottom: 16px; }
    .field-row label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .submit-status { font-size: 13px; margin: 10px 0 4px; min-height: 20px; }
    .submit-status.success { color: var(--green); }
    .submit-status.success a { color: var(--green); }
    .submit-status.error { color: #c0392b; }

    /* ── Ratings ───────────────────────────────────────────────────── */

    .rating-book {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 0 18px;
      align-items: start;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .rating-book:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .score-col { text-align: right; padding-top: 3px; }
    .score-val {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: normal;
      line-height: 1;
      display: block;
    }
    .score-denom { font-size: 11px; color: var(--muted); display: block; text-align: right; }
    .score-dnf-label { font-size: 13px; font-family: var(--sans); font-weight: 600; letter-spacing: .04em; }

    .s9  { color: var(--green); }
    .s7  { color: var(--amber); }
    .s6  { color: var(--tan); }
    .s4  { color: var(--red); }
    .sdnf { color: var(--red); }

    .rating-title {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .rating-author { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .rating-format { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 10px; }
    .rating-notes { font-size: 14px; line-height: 1.75; }
    .rating-notes p + p { margin-top: 10px; }

    /* ── Rate button ───────────────────────────────────────────────── */

    .btn-rate {
      font-size: 12px;
      color: var(--green);
      border: 1px solid var(--green);
      background: none;
      padding: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-family: var(--sans);
      line-height: 1.5;
    }
    .btn-rate:hover { background: rgba(42, 92, 63, 0.08); }

    /* ── Rate modal ────────────────────────────────────────────────── */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 28px 24px;
      max-width: 460px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .modal-title {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: normal;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    .modal-close:hover { color: var(--text); }

    /* ── Mobile ────────────────────────────────────────────────────── */

    @media (max-width: 480px) {
      .tab { padding: 12px 14px; }
    }
  </style>

<script>
  const REPO = 'teddyballgm/TBR';
  const API  = 'https://api.github.com';

  // ── GitHub API (reads only — unauthenticated) ─────────────────────

  async function ghFetch(path) {
    const res = await fetch(`${API}${path}`, {
      headers: { Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.message || `GitHub API error ${res.status}`);
    }
    return res.json();
  }

  async function getFileContent(path) {
    const data = await ghFetch(`/repos/${REPO}/contents/${path}`);
    return { content: b64Decode(data.content) };
  }

  function b64Decode(b64) {
    return decodeURIComponent(
      atob(b64.replace(/\n/g, '')).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join('')
    );
  }

  // ── Helpers ───────────────────────────────────────────────────────

  function jsonPost(body) {
    return {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    };
  }

  // ── TBR parser ────────────────────────────────────────────────────

  function parseTBR(md) {
    const result = { tiers: [], alreadyRead: [] };
    const parts = md.split(/^(?=## )/m);

    for (const part of parts) {
      if (!part.startsWith('## ')) continue;
      const nl = part.indexOf('\n');
      const heading = part.slice(3, nl).trim();
      const body    = part.slice(nl + 1);

      if (heading.startsWith('Already Read')) {
        result.alreadyRead = parseAlreadyRead(body);
      } else if (heading.startsWith('Tier')) {
        result.tiers.push({ name: heading, books: parseTierBooks(body) });
      }
    }
    return result;
  }

  function parseTierBooks(body) {
    const books = [];
    const parts = body.split(/^(?=### )/m);
    for (const part of parts) {
      if (!part.startsWith('### ')) continue;
      const book = parseBook(part.slice(4));
      if (book) books.push(book);
    }
    return books;
  }

  function parseBook(text) {
    const lines  = text.split('\n');
    const header = lines[0].trim();

    const recMatch  = header.match(/\*\(rec from ([^)]+)\)\*/);
    const recSource = recMatch ? recMatch[1].trim() : null;
    const clean     = header.replace(/\s*\*\(rec from [^)]+\)\*/, '').trim();

    const dash = clean.indexOf(' — ');
    if (dash === -1) return null;
    const title  = clean.slice(0, dash).trim();
    const author = clean.slice(dash + 3).trim();

    let kindleUrl = null, price = null, origPrice = null, alertPrice = null;
    let whyHere = '', caveat = '', series = null;
    let purchased = false, purchaseFormat = null;
    let field = null;

    for (let i = 1; i < lines.length; i++) {
      const t = lines[i].trim();

      if (/^-{3,}$/.test(t) || t === '') continue;

      if (t.startsWith('**Kindle:**')) {
        field = 'kindle';
        const urlM = t.match(/\[(?:[^\]]+)\]\(([^)]+)\)/);
        if (urlM) kindleUrl = urlM[1];
        if (/purchased/i.test(t) && !urlM) {
          purchased = true;
          purchaseFormat = 'kindle';
        }
        const priceM = t.match(/Price:\s*(.+)/);
        if (priceM) {
          const ps = priceM[1];
          if (!ps.includes('not yet tracked')) {
            const cur  = ps.match(/\$[\d.]+/);
            if (cur) price = cur[0];
            const orig = ps.match(/~~(\$[\d.]+)~~/);
            if (orig) origPrice = orig[1];
            const alrt = ps.match(/alert set @ (\$[\d.]+)/);
            if (alrt) alertPrice = alrt[1];
          }
        }
      } else if (t.startsWith('**Audible:**')) {
        field = null;
        if (/purchased/i.test(t)) { purchased = true; purchaseFormat = 'audible'; }
      } else if (t.startsWith('**Whispersync:**')) {
        field = null;
        if (/purchased/i.test(t)) { purchased = true; purchaseFormat = 'whispersync'; }
      } else if (t.startsWith("**Why it's here:**") || t.startsWith("**Why it’s here:**")) {
        field = 'why';
        whyHere = t.replace(/^\*\*Why it['']s here:\*\*\s*/, '');
      } else if (/^\*\*The (?:caveat|bet):\*\*/.test(t)) {
        field = 'caveat';
        caveat = t.replace(/^\*\*The (?:caveat|bet):\*\*\s*/, '');
      } else if (t.startsWith('**Series:**')) {
        field = null;
        series = t.replace(/^\*\*Series:\*\*\s*/, '').trim();
      } else if (t.startsWith('**Status:**')) {
        field = null;
        if (/purchased/i.test(t)) {
          purchased = true;
          if (!purchaseFormat) {
            if (/kindle/i.test(t))      purchaseFormat = 'kindle';
            else if (/audible/i.test(t))      purchaseFormat = 'audible';
            else if (/whispersync/i.test(t))  purchaseFormat = 'whispersync';
          }
        }
      } else if (t.startsWith('**')) {
        field = null;
      } else if (field === 'why') {
        whyHere += ' ' + t;
      } else if (field === 'caveat') {
        caveat += ' ' + t;
      }
    }

    return { title, author, series, recSource, kindleUrl, price, origPrice, alertPrice,
             whyHere: whyHere.trim(), caveat: caveat.trim(), purchased, purchaseFormat };
  }

  function parseAlreadyRead(body) {
    return body.split('\n')
      .filter(l => l.trim().startsWith('- '))
      .map(l => l.replace(/^-\s+/, '').trim())
      .filter(Boolean);
  }

  // ── Ratings parser ────────────────────────────────────────────────

  function parseRatings(md) {
    const books = [];
    const parts = md.split(/^(?=## )/m);

    for (const part of parts) {
      if (!part.startsWith('## ')) continue;
      const nl      = part.indexOf('\n');
      const heading = part.slice(3, nl).trim();
      const body    = part.slice(nl + 1);
      const isDNF   = /not finish/i.test(heading);

      const bookParts = body.split(/^(?=### )/m);
      for (const bp of bookParts) {
        if (!bp.startsWith('### ')) continue;
        const book = parseRatedBook(bp.slice(4), isDNF);
        if (book) books.push(book);
      }
    }

    books.sort((a, b) => {
      if (a.isDNF !== b.isDNF) return a.isDNF ? 1 : -1;
      return b.score - a.score;
    });
    return books;
  }

  function parseRatedBook(text, isDNF) {
    const lines  = text.split('\n');
    const header = lines[0].trim();

    // The format note (e.g. *(Kindle)*) is the last thing on the header line.
    // Anchor to the end and allow nested parens — e.g. *(Whispersync (mostly
    // audible))* — which a [^)]+ inner class would fail to strip, leaving
    // trailing text that breaks the score match below.
    const fmtMatch   = header.match(/\*\((.+)\)\*\s*$/);
    const formatNote = fmtMatch ? fmtMatch[1] : null;
    const clean = header.replace(/\s*\*\(.+\)\*\s*$/, '').trim();

    const m = clean.match(/^(.+?)\s+·\s+([\d.]+(?:-[\d.]+)?)\/10$/);

    let titleAuthor, scoreStr, score;
    if (m) {
      titleAuthor = m[1].trim();
      scoreStr    = m[2];
      score = scoreStr.includes('-')
        ? (parseFloat(scoreStr) + parseFloat(scoreStr.split('-')[1])) / 2
        : parseFloat(scoreStr);
    } else if (isDNF) {
      // DNF entries may carry no numeric score — "Title — Author · DNF". The
      // renderer already handles a scoreless DNF (shows a "DNF" badge); it just
      // never received one because the score pattern above didn't match.
      const d = clean.match(/^(.+?)\s+·/);
      if (!d) return null;
      titleAuthor = d[1].trim();
      scoreStr    = null;
      score       = -1; // sorts to the bottom within the DNF group
    } else {
      return null;
    }

    let title, author;
    const dash = titleAuthor.indexOf(' — ');
    if (dash !== -1) {
      title  = titleAuthor.slice(0, dash).trim();
      author = titleAuthor.slice(dash + 3).trim();
    } else {
      title  = titleAuthor;
      author = '';
    }

    const notes = lines.slice(1)
      .filter(l => l.trim() && !/^-{3,}$/.test(l.trim()))
      .join('\n').trim();

    return { title, author, score, scoreStr, formatNote, notes, isDNF };
  }

  // ── Render TBR ────────────────────────────────────────────────────

  function renderTBR(data) {
    let html = '';

    data.tiers.forEach((tier, idx) => {
      const expanded = idx === 0;
      html += `<section class="tier-section${expanded ? '' : ' collapsed'}">`;
      html += `<div class="tier-heading" role="button" tabindex="0" aria-expanded="${expanded}">`;
      html += `<span class="tier-chevron">${expanded ? '▾' : '▸'}</span>`;
      html += `${e(tier.name)}`;
      html += `</div>`;
      html += `<div class="tier-body">`;
      for (const book of tier.books) html += renderTBRBook(book, expanded);
      html += `</div>`;
      html += `</section>`;
    });

    if (data.alreadyRead.length) {
      html += `<section class="already-read collapsed">`;
      html += `<div class="tier-heading" role="button" tabindex="0" aria-expanded="false">`;
      html += `<span class="tier-chevron">▸</span>`;
      html += `Already Read / Removed`;
      html += `</div>`;
      html += `<div class="tier-body"><ul>`;
      for (const item of data.alreadyRead) html += `<li>${e(item)}</li>`;
      html += `</ul></div>`;
      html += `</section>`;
    }

    document.getElementById('tbr-content').innerHTML = html;
    wireCollapse();
  }

  function renderTBRBook(b, expanded = true) {
    let h = `<article class="tbr-book${expanded ? '' : ' collapsed'}">`;

    h += `<div class="book-header" role="button" tabindex="0" aria-expanded="${expanded}">`;
    h += `<span class="book-chevron">${expanded ? '▾' : '▸'}</span>`;
    h += `<div class="book-header-text">`;
    h += `<div class="book-title">${e(b.title)}</div>`;
    h += `<div class="book-byline">${e(b.author)}`;
    if (b.recSource) h += ` <span class="book-rec">· rec from ${e(b.recSource)}</span>`;
    h += `</div></div></div>`;

    h += `<div class="book-body">`;
    h += `<div class="kindle-line">`;
    if (b.purchased) {
      h += `<span class="owned-pill">owned</span>`;
      if (b.purchaseFormat) {
        const rateKey = `${b.title.toLowerCase()}|${b.author.toLowerCase()}`;
        if (!ratedSet.has(rateKey)) {
          h += `<button class="btn-rate" data-title="${e(b.title)}" data-author="${e(b.author)}" data-series="${e(b.series || '')}">Rate</button>`;
        }
      }
    } else {
      if (b.kindleUrl) h += `<a href="${e(b.kindleUrl)}" target="_blank" rel="noopener">Track on eReaderIQ</a>`;
      if (b.price) {
        h += `<span class="price">${e(b.price)}</span>`;
        if (b.origPrice) h += ` <span class="price-orig">${e(b.origPrice)}</span>`;
        if (b.alertPrice) h += ` <span class="price-alert">🔔 ${e(b.alertPrice)}</span>`;
      } else if (b.kindleUrl) {
        h += `<span class="price-untracked">price not yet tracked</span>`;
      }
    }
    h += `</div>`;
    if (b.whyHere) {
      h += `<div class="book-field"><div class="field-label">Why it's here</div>`;
      h += `<div class="field-body">${e(b.whyHere)}</div></div>`;
    }
    if (b.caveat) {
      h += `<div class="book-field"><div class="field-label">The caveat</div>`;
      h += `<div class="field-body">${e(b.caveat)}</div></div>`;
    }
    h += `</div>`; // .book-body

    h += `</article>`;
    return h;
  }

  function wireCollapse() {
    const content = document.getElementById('tbr-content');

    content.querySelectorAll('.tier-heading[role="button"]').forEach(heading => {
      const toggle = () => {
        const section = heading.parentElement;
        const nowCollapsed = section.classList.toggle('collapsed');
        heading.querySelector('.tier-chevron').textContent = nowCollapsed ? '▸' : '▾';
        heading.setAttribute('aria-expanded', String(!nowCollapsed));
      };
      heading.addEventListener('click', toggle);
      heading.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
    });

    content.querySelectorAll('.book-header').forEach(header => {
      const toggle = () => {
        const book = header.parentElement;
        const nowCollapsed = book.classList.toggle('collapsed');
        header.querySelector('.book-chevron').textContent = nowCollapsed ? '▸' : '▾';
        header.setAttribute('aria-expanded', String(!nowCollapsed));
      };
      header.addEventListener('click', toggle);
      header.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
    });
  }

  // ── Render Ratings ────────────────────────────────────────────────

  function renderRatings(books) {
    let html = '';
    for (const book of books) html += renderRatedBook(book);
    document.getElementById('ratings-content').innerHTML = html;
  }

  function renderRatedBook(b) {
    const cls = b.isDNF ? 'sdnf'
      : b.score >= 9 ? 's9'
      : b.score >= 7 ? 's7'
      : b.score >= 6 ? 's6' : 's4';

    let h = `<article class="rating-book">`;

    h += `<div class="score-col">`;
    if (b.isDNF && !b.scoreStr) {
      h += `<span class="score-val ${cls} score-dnf-label">DNF</span>`;
    } else {
      h += `<span class="score-val ${cls}">${e(b.scoreStr)}</span>`;
      h += `<span class="score-denom">/10</span>`;
    }
    h += `</div>`;

    h += `<div>`;
    h += `<div class="rating-title">${e(b.title)}</div>`;
    if (b.author) h += `<div class="rating-author">${e(b.author)}</div>`;
    if (b.formatNote) h += `<div class="rating-format">${e(b.formatNote)}</div>`;
    if (b.notes) {
      h += `<div class="rating-notes">`;
      h += b.notes.split(/\n\n+/).map(p => `<p>${e(p.replace(/\n/g, ' '))}</p>`).join('');
      h += `</div>`;
    }
    h += `</div>`;

    h += `</article>`;
    return h;
  }

  // ── HTML escape ───────────────────────────────────────────────────

  function e(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Data loading ──────────────────────────────────────────────────

  let ratingsLoaded = false;
  let ratedSet = new Set();
  let cachedRatingsMd = null;

  async function fetchRatingsMd() {
    if (!cachedRatingsMd) {
      const { content } = await getFileContent('ratings.md');
      cachedRatingsMd = content;
    }
    return cachedRatingsMd;
  }

  function buildRatedSet(md) {
    const set = new Set();
    const regex = /^### (.+?) — (.+?) ·/gm;
    let m;
    while ((m = regex.exec(md)) !== null) {
      set.add(`${m[1].trim().toLowerCase()}|${m[2].trim().toLowerCase()}`);
    }
    return set;
  }

  async function loadTBR() {
    const loading = document.getElementById('tbr-loading');
    const errEl   = document.getElementById('tbr-error');
    const content = document.getElementById('tbr-content');
    const submit  = document.getElementById('submit-section');

    loading.style.display = '';
    errEl.style.display   = 'none';
    content.style.display = 'none';
    submit.style.display  = 'none';

    try {
      const [{ content: tbrMd }] = await Promise.all([
        getFileContent('tbr.md'),
        fetchRatingsMd().then(md => { ratedSet = buildRatedSet(md); }).catch(() => {})
      ]);
      renderTBR(parseTBR(tbrMd));
      content.style.display = '';
      submit.style.display  = '';
    } catch (err) {
      errEl.textContent   = err.message;
      errEl.style.display = '';
    } finally {
      loading.style.display = 'none';
    }
  }

  async function loadRatings() {
    const loading = document.getElementById('ratings-loading');
    const errEl   = document.getElementById('ratings-error');
    const content = document.getElementById('ratings-content');
    const submit  = document.getElementById('ratings-submit-section');

    loading.style.display = '';
    errEl.style.display   = 'none';
    content.style.display = 'none';
    submit.style.display  = 'none';

    try {
      const md = await fetchRatingsMd();
      renderRatings(parseRatings(md));
      content.style.display = '';
      submit.style.display  = '';
      ratingsLoaded = true;
    } catch (err) {
      errEl.textContent   = err.message;
      errEl.style.display = '';
    } finally {
      loading.style.display = 'none';
    }
  }

  // ── Tab switching ─────────────────────────────────────────────────

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      document.getElementById('tab-tbr').style.display     = target === 'tbr'     ? '' : 'none';
      document.getElementById('tab-ratings').style.display = target === 'ratings' ? '' : 'none';
      if (target === 'ratings' && !ratingsLoaded) loadRatings();
    });
  });

  // ── TBR form ──────────────────────────────────────────────────────

  document.getElementById('submit-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn      = document.getElementById('submit-btn');
    const statusEl = document.getElementById('submit-status');
    const title    = document.getElementById('sub-title').value.trim();
    const author   = document.getElementById('sub-author').value.trim();
    const recSource     = document.getElementById('sub-source').value.trim() || null;
    const submitterName = document.getElementById('sub-name').value.trim()   || null;
    if (!title || !author) return;

    btn.disabled    = true;
    btn.textContent = 'Opening PR…';
    statusEl.className   = 'submit-status';
    statusEl.textContent = '';

    try {
      const res  = await fetch('/api/submit', jsonPost({ type: 'tbr', title, author, recSource, submitterName }));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to open PR');
      statusEl.className = 'submit-status success';
      statusEl.innerHTML = `PR opened: <a href="${e(data.prUrl)}" target="_blank" rel="noopener">${e(data.prUrl)}</a>`;
      ev.target.reset();
    } catch (err) {
      statusEl.className   = 'submit-status error';
      statusEl.textContent = err.message || 'Failed to open PR';
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Open PR';
    }
  });

  // ── Ratings form ──────────────────────────────────────────────────

  document.getElementById('ratings-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn      = document.getElementById('ratings-submit-btn');
    const statusEl = document.getElementById('ratings-submit-status');
    const title    = document.getElementById('rat-title').value.trim();
    const author   = document.getElementById('rat-author').value.trim();
    const scoreStr = document.getElementById('rat-score').value;
    const format   = document.getElementById('rat-format').value.trim() || null;
    const notes    = document.getElementById('rat-notes').value.trim()  || null;
    if (!title || !author || !scoreStr) return;

    btn.disabled    = true;
    btn.textContent = 'Opening PR…';
    statusEl.className   = 'submit-status';
    statusEl.textContent = '';

    try {
      const res  = await fetch('/api/submit', jsonPost({ type: 'rating', title, author, scoreStr, format, notes }));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to open PR');
      statusEl.className = 'submit-status success';
      statusEl.innerHTML = `PR opened: <a href="${e(data.prUrl)}" target="_blank" rel="noopener">${e(data.prUrl)}</a>`;
      ev.target.reset();
    } catch (err) {
      statusEl.className   = 'submit-status error';
      statusEl.textContent = err.message || 'Failed to open PR';
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Open PR';
    }
  });

  // ── Rate modal ────────────────────────────────────────────────────

  function openRateModal(title, author, series) {
    document.getElementById('rate-title').value  = title;
    document.getElementById('rate-author').value = author;
    document.getElementById('rate-series').value = series || '';
    document.getElementById('rate-score').value  = '';
    document.getElementById('rate-format').value = '';
    document.getElementById('rate-notes').value  = '';
    const statusEl = document.getElementById('rate-submit-status');
    statusEl.className   = 'submit-status';
    statusEl.textContent = '';
    const btn = document.getElementById('rate-submit-btn');
    btn.disabled    = false;
    btn.textContent = 'Open PR';
    document.getElementById('rate-modal').style.display = '';
    document.getElementById('rate-score').focus();
  }

  function closeRateModal() {
    document.getElementById('rate-modal').style.display = 'none';
  }

  document.getElementById('rate-modal-close').addEventListener('click', closeRateModal);

  document.getElementById('rate-modal').addEventListener('click', ev => {
    if (ev.target === ev.currentTarget) closeRateModal();
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') closeRateModal();
  });

  document.getElementById('tbr-content').addEventListener('click', ev => {
    const btn = ev.target.closest('.btn-rate');
    if (btn) {
      ev.stopPropagation();
      openRateModal(btn.dataset.title, btn.dataset.author, btn.dataset.series);
    }
  });

  document.getElementById('rate-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn      = document.getElementById('rate-submit-btn');
    const statusEl = document.getElementById('rate-submit-status');
    const title    = document.getElementById('rate-title').value.trim();
    const author   = document.getElementById('rate-author').value.trim();
    const series   = document.getElementById('rate-series').value.trim() || null;
    const scoreStr = document.getElementById('rate-score').value;
    const format   = document.getElementById('rate-format').value.trim() || null;
    const notes    = document.getElementById('rate-notes').value.trim()  || null;
    if (!title || !author || !scoreStr) return;

    btn.disabled    = true;
    btn.textContent = 'Opening PR…';
    statusEl.className   = 'submit-status';
    statusEl.textContent = '';

    try {
      const res  = await fetch('/api/submit', jsonPost({ type: 'rating', title, author, series, scoreStr, format, notes }));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to open PR');
      statusEl.className = 'submit-status success';
      statusEl.innerHTML = `PR opened: <a href="${e(data.prUrl)}" target="_blank" rel="noopener">${e(data.prUrl)}</a>`;
    } catch (err) {
      statusEl.className   = 'submit-status error';
      statusEl.textContent = err.message || 'Failed to open PR';
      btn.disabled    = false;
      btn.textContent = 'Open PR';
    }
  });

  // ── Init ──────────────────────────────────────────────────────────

  loadTBR();
</script>
</body>
</html>
