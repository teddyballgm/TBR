name: Enrich Submission

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: read

jobs:
  enrich:
    # github.event.pull_request.head.ref is the source branch name from the
    # webhook payload — more reliable than github.head_ref in all runner versions.
    # `submit/` = a new TBR book (fill in triage fields); `rating/` = a new
    # rating (examine the queue and reconcile it against what was just read).
    if: ${{ startsWith(github.event.pull_request.head.ref, 'submit/') || startsWith(github.event.pull_request.head.ref, 'rating/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0          # needed for git diff origin/main...HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enrich submission
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT:            ${{ secrets.GH_PAT }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_HEAD_REF:       ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/enrich.mjs
